<style>
:root{--bg:#1d2b23;--fg:#f0f2ee;--mut:#97a89d;--card:#24352b;--line:#35493d;--ink:#0e1712;--ac:#f2f2f2;--hh:73px;--hd:"MoonGet",sans-serif;--sb:"BrassMono",ui-monospace,Menlo,monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f2f2;--fg:#111;--mut:#666;--card:#fff;--line:#dcdcdc;--ink:#c4c4c4;--ac:#111;color-scheme:light}}
:root[data-theme="light"]{--bg:#f2f2f2;--fg:#111;--mut:#666;--card:#fff;--line:#dcdcdc;--ink:#c4c4c4;--ac:#111;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Inter","Helvetica Neue",Arial,sans-serif;overflow-x:clip;position:relative;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;padding:14px 22px;background:var(--bg)}
.burger{width:44px;height:44px;border:1px solid var(--line);border-radius:0;background:var(--card);cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;transition:.2s}
.burger:hover{border-color:var(--ac)}.burger span{width:18px;height:2px;background:var(--fg);border-radius:0;transition:.25s}
body.open .burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}body.open .burger span:nth-child(2){opacity:0}body.open .burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.logo{font:800 clamp(12px,3.6vw,22px) var(--hd);min-width:0;letter-spacing:.04em;text-transform:uppercase;user-select:none;cursor:default}
.logo b{color:var(--ac)}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.3s;z-index:18}
#drawer{position:fixed;top:calc(var(--hh) + env(safe-area-inset-top,0px));left:0;right:0;max-height:calc(100vh - var(--hh) - 17px);max-height:calc(100dvh - var(--hh) - 17px);overflow:auto;visibility:hidden;background:var(--card);z-index:19;transform:translateY(-110%);pointer-events:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s;padding:22px 22px 28px;display:flex;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:18px 56px;border-bottom:1px solid var(--line)}
#drawer .col{display:flex;flex-direction:column;gap:2px;min-width:140px}
body.open #drawer{transform:none;pointer-events:auto;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s}body.open #veil{opacity:1;pointer-events:auto}
#drawer a{display:block;color:var(--mut);text-decoration:none;font-size:15px;line-height:1.5;padding:4px 0;transition:.2s}
#drawer a:hover{color:var(--fg);padding-left:6px}
#drawer a.cat{font-family:var(--sb);color:var(--fg);text-transform:uppercase;letter-spacing:.08em;font-size:14px;padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
#drawer a.cat:hover{padding-left:0}#drawer a.cat.on{border-bottom-color:var(--fg)}
main{max-width:1180px;margin:0 auto;padding:36px 22px 120px;position:relative;z-index:1}
#deco{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#deco i{position:absolute;display:block;background:var(--fg);opacity:.14;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
h1{font:800 clamp(40px,8vw,84px)/1 var(--hd);margin:0 0 10px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--mut)}
h2{font:800 clamp(24px,4vw,34px) var(--hd);margin:64px 0 20px}
.sub{color:var(--mut);margin:0 0 30px;font-size:18px;max-width:560px}
.sun{position:relative}
.raysw{position:absolute;left:50%;top:50%;width:min(130%,100vw);aspect-ratio:1;translate:-50% -50%;z-index:-1;pointer-events:none;overflow:clip}
.rays{display:block;width:100%;height:100%;animation:spin 140s linear infinite}
@keyframes spin{to{rotate:360deg}}
@media (prefers-reduced-motion:reduce){.rays{animation:none}}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:30px;align-items:center;margin-top:34px}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);border:1px solid var(--ac);border-radius:0;padding:3px 12px}
.hero h2{margin:14px 0 6px;font-size:clamp(28px,4.5vw,46px);line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.wrap{position:relative}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:0;overflow:hidden;color:inherit;text-decoration:none;transition:.3s}
.card:hover{transform:translateY(-6px);border-color:var(--ac);box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}
.th{background:#202020;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.th i{z-index:1;width:58px;height:58px;border-radius:0;background:#fff;display:flex;align-items:center;justify-content:center;transition:.3s}
.card:hover .th i{transform:scale(1.15)}
.th i::after{content:"";border-left:16px solid #111;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.th b{font:800 72px var(--hd);color:rgba(255,255,255,.9);z-index:1}
.star{position:absolute;top:10px;right:12px;color:#fff;font-size:20px;z-index:2;text-shadow:0 1px 5px rgba(0,0,0,.7)}
.ci{padding:14px 16px 18px}.ci h3{margin:0;font:800 19px/1.4 var(--hd)}.ci p{margin:6px 0 0;color:var(--mut);font-size:14px}
.ci p,.hero p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden;overflow-wrap:anywhere}
.hero p{-webkit-line-clamp:5;line-clamp:5}
.meta{font-size:13px;color:var(--mut)}
.btn{display:inline-block;margin:14px 8px 0 0;padding:11px 22px;border-radius:0;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:600;border:0;cursor:pointer;font:600 15px "Inter",sans-serif}
.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}.btn.alt:hover{border-color:var(--ac)}
.btn.red{background:#c92a2a;color:#fff}
.year{font:800 clamp(40px,7vw,64px) var(--hd);color:transparent;-webkit-text-stroke:1px var(--mut);margin:48px 0 14px;line-height:1}
.empty{color:var(--mut)}
.adm{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:5}
.adm button{border:0;border-radius:0;padding:6px 10px;font:600 12px "Inter";cursor:pointer;background:#fff;color:#111}
.adm button.d{background:#c92a2a;color:#fff}

#bar .btn{margin:0;padding:8px 14px;font-size:13px}

#modal.on{display:flex}
.intro{max-width:640px;margin-top:40px}.intro h2{margin:14px 0 10px}.intro p{margin:0;color:var(--mut)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
.fld{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mut)}
.thz{position:relative;aspect-ratio:16/9;border:1px dashed var(--mut);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;cursor:pointer;overflow:hidden;background:var(--bg);color:var(--mut);font-weight:400}
.thz img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thz.over,.thz:focus-visible{border-color:var(--fg);outline:none}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:70;max-width:min(92vw,520px);background:var(--fg);color:var(--bg);padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
body.lock{overflow:hidden}
#modal:focus{outline:none}
#modal form{background:var(--card);border:1px solid var(--line);border-radius:0;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px}
#modal h3{margin:0;font:800 24px/1.35 var(--hd)}
label{font-size:13px;font-weight:600;display:grid;gap:4px;color:var(--mut)}
input,select,textarea{font:inherit;padding:10px 12px;border-radius:0;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:10px;border-radius:0;font-size:12px;max-height:200px;overflow:auto}
#modal form.pop{width:min(640px,100%);padding:0;gap:0;overflow:auto}
.pop .th{aspect-ratio:16/9;border-radius:0;display:flex;text-decoration:none}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pop .th i{width:72px;height:72px}
.pop .bd{padding:22px 26px 26px;display:grid;gap:12px}
.pop h3{font-size:clamp(26px,5vw,36px);line-height:1.3}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:0;padding:4px 12px;color:var(--mut)}
.chip.k{border-color:var(--ac);color:var(--ac)}
.crew{list-style:none;margin:0;padding:0;display:grid;gap:0}
.crew li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.crew li span{color:var(--mut);text-align:right}
.pop h4{margin:10px 0 0;font:800 16px var(--hd);letter-spacing:.1em;text-transform:uppercase;color:var(--ac)}

function drawSun(){
  const c=document.querySelector(".rays");if(!c)return;
  const S=1400,C=S/2,r0=260,R=690;c.width=c.height=S;
  const g=c.getContext("2d");g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#0e1712";
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  let a=rnd()*6.28;
  for(let i=0;i<13;i++){
    const w=.1+rnd()*.16,len=R*(.75+rnd()*.25),n=Math.round(150+w*1500*(len/R));
    for(let k=0;k<n;k++){
      const t=Math.pow(rnd(),1.25),r=r0+(len-r0)*t,half=w/2*(.6+.9*t),an=a+w/2+(rnd()-.5)*2*half;
      g.fillRect(C+Math.cos(an)*r,C+Math.sin(an)*r,2.8,2.8);
    }
    a+=w+.14+rnd()*.2;
  }
}

  t.addEventListener('pointerleave',()=>hover=false);
  ['touchstart','touchmove','wheel','pointerdown'].forEach(ev=>t.addEventListener(ev,()=>{HOLD=Date.now()+1800},{passive:true}));
  const n=+t.dataset.n;

    if(hover||Date.now()<HOLD||$('#modal').classList.contains('on')){pos=t.scrollLeft}

/* Easter egg : Konami code, ou 5 clics rapides sur le logo */
const K=["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];let ki=0;
addEventListener("keydown",e=>{if(e.key==="Escape"){close();setMenu(false);return}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.length>1?e.key:e.key.toLowerCase();ki=k===K[ki]?ki+1:(k===K[0]?1:0);if(ki===K.length){ki=0;setAdmin(!ADMIN)}});
let lc=0,lt;$("#logo").onclick=()=>{lc++;clearTimeout(lt);lt=setTimeout(()=>lc=0,1500);if(lc>=5){lc=0;setAdmin(!ADMIN)}};
const setHH=()=>document.documentElement.style.setProperty("--hh",$("header").offsetHeight+"px");
if(window.ResizeObserver)new ResizeObserver(setHH).observe($("header"));addEventListener("resize",setHH);setHH();
function setMenu(o){document.body.classList.toggle("open",o);$("#bg").setAttribute("aria-expanded",String(o))}
$("#bg").onclick=()=>setMenu(!document.body.classList.contains("open"));$("#veil").onclick=()=>setMenu(false);
$("#drawer").addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;setMenu(false);if(a.getAttribute("href")===(location.hash||"#accueil"))route(true)});
$("#modal").onclick=e=>{if(e.target.id==="modal")close()};
